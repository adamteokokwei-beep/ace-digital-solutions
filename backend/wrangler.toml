name = "ace-chat"
main = "./production-worker.js"
compatibility_date = "2026-01-01"
keep_vars = false
[placement]
region = "gcp:us-east4"
[observability]
enabled = true
[vars]
AI_DISABLED = "false"
STAGING = "false"
AI_MOCK = "false"
ALLOWED_ORIGIN = "https://acedigitalsolutionsbiz.org,https://www.acedigitalsolutionsbiz.org"
CHAT_DAILY_CAP = "100"
CHAT_IP_PER_HOUR = "20"
GEMINI_MODEL = "gemini-3.1-flash-lite"
GEMINI_BACKUP_MODEL = "gemini-3.5-flash-lite"
GEMINI_MAX_OUTPUT_TOKENS = "600"
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 10
period = 60
[[durable_objects.bindings]]
name = "USAGE"
class_name = "ChatUsage"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatUsage"]
[secrets]
required = ["LIMIT_HMAC_KEY", "GEMINI_API_KEY"]

# PR previews must never use real AI or production counters/credentials.
# The production entry point respects AI_DISABLED before accessing any provider or binding.
[previews.vars]
AI_DISABLED = "true"
AI_MOCK = "false"
STAGING = "false"
ALLOWED_ORIGIN = "https://preview.invalid"
CHAT_DAILY_CAP = "0"
CHAT_IP_PER_HOUR = "0"
