# Cloudflare settings for the chatbot server (ace-chat).
# Used when Cloudflare deploys this Worker automatically from GitHub.
name = "ace-chat"
main = "chat-worker.js"
compatibility_date = "2026-01-01"

# Keep the variables and secrets you set in the Cloudflare dashboard (GEMINI_API_KEY, ALLOWED_ORIGIN, ...).
keep_vars = true

# Always run in the US, next to Google's servers. Gemini's free API is not available
# from some locations (e.g. Hong Kong, where Malaysian visitors are often routed).
[placement]
region = "gcp:us-east4"

[observability]
enabled = true

# Abuse protection for the chatbot: 10 AI requests per visitor per 60 seconds (counters only, no chat content).
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# Atomic AI-usage counter (Red Team L-3): daily total + per-visitor hourly AI attempts, reserved before every attempt.
# SQLite-backed Durable Object (available on the Workers Free plan). Belongs to this Worker only.
[[durable_objects.bindings]]
name = "USAGE"
class_name = "ChatUsage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatUsage"]
