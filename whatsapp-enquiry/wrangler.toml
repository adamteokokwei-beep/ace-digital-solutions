# Cloudflare settings for the WhatsApp enquiry endpoint (separate from the ace-chat chatbot server).
# Deploy only when you're ready:  npx wrangler deploy   (from this folder)
name = "ace-wa-enquiry"
main = "worker.js"
compatibility_date = "2026-01-01"

# Keep the variables and secrets you set in the Cloudflare dashboard.
keep_vars = true

# Cloudflare's built-in rate limiter: 3 enquiries per IP per 60 seconds (counters only, no enquiry content).
# The code also has a simple fallback limiter (3 per 10 minutes per Worker instance).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60

[observability]
enabled = true

# Spam counters only (one-way hashed keys, no enquiry content). Used for the hourly/daily limits.
[[kv_namespaces]]
binding = "ENQ_KV"
id = "31c49a6d55554940b83671b5d140f187"

# Email backup: the Worker emails each enquiry to the owner's VERIFIED address only
# (Cloudflare Email Routing must be enabled on acedigitalsolutionsbiz.org and the address verified first).
[[send_email]]
name = "EMAIL"
destination_address = "adamteokokwei@gmail.com"

[vars]
EMAIL_FROM = "Ace Digital Solutions website <enquiry@acedigitalsolutionsbiz.org>"
EMAIL_TO = "adamteokokwei@gmail.com"
